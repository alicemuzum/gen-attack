[project]
name = "gen-attack"
version = "0.2.0"
description = "Benchmarking adversarial attacks (FGSM, PGD) against image classifiers and object detectors."
authors = [{ name = "Alice Muzum" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<3.13"
keywords = ["adversarial-attacks", "robustness", "fgsm", "pgd", "detr", "pytorch"]
dependencies = [
    "torch>=2.4,<3",
    "torchvision>=0.19",
    "transformers>=4.44,<5",
    "timm>=1.0.9",
    "scipy>=1.10",
    "foolbox>=3.3.4",
    "matplotlib>=3.8",
    "numpy>=1.24,<2",
    "pillow>=10",
]

[project.optional-dependencies]
generation = ["diffusers>=0.30", "accelerate>=0.33"]

[project.scripts]
gen-attack = "gen_attack.cli:main"

[project.urls]
Repository = "https://github.com/alicemuzum/gen-attack"

[tool.poetry]
packages = [{ include = "gen_attack", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
ruff = ">=0.17"
pre-commit = ">=3.8"

[tool.poetry.group.notebooks]
optional = true

[tool.poetry.group.notebooks.dependencies]
ipykernel = "^6.29"
ipywidgets = "^8.1"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
